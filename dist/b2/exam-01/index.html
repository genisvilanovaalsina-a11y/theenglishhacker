out something that did not happen in the past.&quot;]}],[0,{&quot;number&quot;:[0,26],&quot;sentence1&quot;:[0,&quot;\&quot;I&#39;m sorry I&#39;m late for the meeting,\&quot; said David.&quot;],&quot;keyword&quot;:[0,&quot;APOLOGISED&quot;],&quot;sentence2Begin&quot;:[0,&quot;David &quot;],&quot;sentence2End&quot;:[0,&quot; late for the meeting.&quot;],&quot;answer&quot;:[0,&quot;apologised for being&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Apologise for\&quot; requires the gerund (-ing form). This is a reporting structure: \&quot;apologise for being late\&quot;.&quot;]}],[0,{&quot;number&quot;:[0,27],&quot;sentence1&quot;:[0,&quot;People think that the new gallery will open next month.&quot;],&quot;keyword&quot;:[0,&quot;THOUGHT&quot;],&quot;sentence2Begin&quot;:[0,&quot;The new gallery &quot;],&quot;sentence2End&quot;:[0,&quot; opening next month.&quot;],&quot;answer&quot;:[0,&quot;is thought to be&quot;],&quot;explanation&quot;:[0,&quot;Personal passive structure: \&quot;It is thought that X will...\&quot; becomes \&quot;X is thought to be...\&quot;.&quot;]}],[0,{&quot;number&quot;:[0,28],&quot;sentence1&quot;:[0,&quot;You shouldn&#39;t go out without a coat because it&#39;s freezing.&quot;],&quot;keyword&quot;:[0,&quot;BETTER&quot;],&quot;sentence2Begin&quot;:[0,&quot;You &quot;],&quot;sentence2End&quot;:[0,&quot; on a coat because it&#39;s freezing.&quot;],&quot;answer&quot;:[0,&quot;had better put&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Had better + bare infinitive\&quot; is used to give strong advice. \&quot;Put on a coat\&quot; means to wear a coat.&quot;]}],[0,{&quot;number&quot;:[0,29],&quot;sentence1&quot;:[0,&quot;It was such a boring film that I fell asleep.&quot;],&quot;keyword&quot;:[0,&quot;SO&quot;],&quot;sentence2Begin&quot;:[0,&quot;The film &quot;],&quot;sentence2End&quot;:[0,&quot; that I fell asleep.&quot;],&quot;answer&quot;:[0,&quot;was so boring&quot;],&quot;explanation&quot;:[0,&quot;\&quot;So + adjective + that\&quot; expresses a result. The structure transforms \&quot;such a boring film\&quot; into \&quot;so boring\&quot;.&quot;]}],[0,{&quot;number&quot;:[0,30],&quot;sentence1&quot;:[0,&quot;I haven&#39;t heard from my sister for over three weeks.&quot;],&quot;keyword&quot;:[0,&quot;LAST&quot;],&quot;sentence2Begin&quot;:[0,&quot;It&#39;s been over three weeks &quot;],&quot;sentence2End&quot;:[0,&quot; from my sister.&quot;],&quot;answer&quot;:[0,&quot;since I last heard&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Since I last heard\&quot; uses \&quot;since\&quot; to mark the last point in time an event occurred. \&quot;Last\&quot; emphasises it was the most recent occasion.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,5],&quot;type&quot;:[0,&quot;reading-mcq&quot;],&quot;articleTitle&quot;:[0,&quot;A Journey to the Edge of the World&quot;],&quot;text&quot;:[0,&quot;When Elena Miller told her colleagues at a high-profile London law firm that she was quitting to spend a year in the Mongolian steppe, the reaction was predictable. There were gasps of disbelief, a few envious glances, and one senior partner who asked if she&#39;d simply &#39;lost her mind&#39;. Elena, however, had never felt more sane. For a decade, her life had been measured in six-minute billable increments and the grey glow of computer screens. She was thirty-four, successful by every traditional metric, yet she felt like a ghost in her own life.\n\nThe decision hadn&#39;t been sudden. It had started with a book about nomadic cultures she&#39;d picked up at an airport and had grown into an obsession. She didn&#39;t just want a holiday; she wanted to understand a way of existence that was the polar opposite of her own. Six months later, she was stepping off a small plane in Ulaanbaatar, the Mongolian capital, with nothing but a sturdy rucksack and a very basic grasp of the local language. From there, it was a long, bumpy journey by jeep to the Altai Mountains, where she would be staying with a family of eagle hunters.\n\nThe first few weeks were a brutal shock. The silence was the first thing that hit her—a physical weight that felt heavy after the constant hum of London. Then there was the cold, which seeped into her bones despite the layers of wool and sheepskin. Elena had to learn how to help with the daily chores: milking goats, collecting dried dung for fuel, and preparing traditional meals. There were moments, usually around 4:00 AM when the temperature inside the family&#39;s &#39;ger&#39; (a traditional tent) dropped below freezing, when she questioned her choices. She missed hot showers, reliable Wi-Fi, and the effortless convenience of city life.\n\nHowever, as the months passed, something shifted. Elena began to appreciate the rhythm of the nomadic life, which was governed by the sun and the needs of the animals rather than a digital calendar. She developed a deep bond with the family, especially the daughter, Altana, who was eager to learn English. In return, Altana taught Elena the art of riding horses across the rugged terrain. Elena discovered a sense of resilience she hadn&#39;t known she possessed. She realised that her previous life had been cluttered with &#39;necessities&#39; that were actually distractions.\n\nOne afternoon, while watching the family&#39;s golden eagle soar above the peaks, Elena had a moment of profound clarity. She wasn&#39;t the same person who had left Heathrow. The anxiety that had been her constant companion in London had vanished, replaced by a quiet confidence. She knew she couldn&#39;t stay in Mongolia forever—the harsh winters were approaching, and she had responsibilities back home—but she also knew she couldn&#39;t return to her old desk.\n\nWhen Elena finally returned to London, her friends remarked on how different she looked. It wasn&#39;t just the tan or the fact that she&#39;d lost weight; it was the way she carried herself. She eventually set up a consultancy firm that helped people transition into more meaningful careers. Looking back, Elena doesn&#39;t see her year in Mongolia as an escape, but as a confrontation with herself. She had gone to the edge of the world to find her own centre.&quot;],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,31],&quot;question&quot;:[0,&quot;In the first paragraph, what do we learn about Elena&#39;s colleagues?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;They were concerned about her mental health.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;They were all secretly jealous of her decision.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;They thought she was making a professional mistake.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;They had a variety of reactions to her news.&quot;]}]]],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;The text mentions disbelief, envious glances and doubt about her sanity — a variety of different reactions. Option A is too narrow (only one person made the mental health comment). B is an overstatement.&quot;]}],[0,{&quot;number&quot;:[0,32],&quot;question&quot;:[0,&quot;What prompted Elena to choose Mongolia specifically?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;A long-standing interest in eagle hunting.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;An accidental discovery of a book.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;A desire to escape the airport environment.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;A recommendation from a senior partner.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;The text says she \&quot;picked up\&quot; the book at an airport — an accidental discovery, not a deliberate act. The book grew into an obsession which led to Mongolia.&quot;]}],[0,{&quot;number&quot;:[0,33],&quot;question&quot;:[0,&quot;What was Elena&#39;s initial experience of living in the Altai Mountains?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;She found the physical tasks easier than expected.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;She struggled with the lack of modern comforts.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;She was surprised by the noise of the animals.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;She regretted not bringing more warm clothing.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;The text explicitly states she missed hot showers, reliable Wi-Fi and convenience. A is contradicted by \&quot;brutal shock\&quot;. C is the opposite — silence was the striking thing.&quot;]}],[0,{&quot;number&quot;:[0,34],&quot;question&quot;:[0,&quot;How did Elena&#39;s perspective change during her stay?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;She decided she wanted to live in a &#39;ger&#39; permanently.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;She became frustrated with the lack of a digital calendar.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;She came to value a simpler way of living.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;She realised she was not as resilient as she thought.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;She learned that her old life was \&quot;cluttered with necessities that were actually distractions\&quot;, showing she came to value simplicity. D is the opposite: she discovered resilience she hadn&#39;t known she had.&quot;]}],[0,{&quot;number&quot;:[0,35],&quot;question&quot;:[0,&quot;The phrase &#39;cluttered with necessities&#39; suggests that Elena felt her old life was...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;Full of things that she didn&#39;t really need.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;Organised in a very efficient way.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;Difficult because she lacked essential items.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;Messy because she had too many hobbies.&quot;]}]]],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Cluttered\&quot; implies too many things, and \&quot;necessities\&quot; in quotes implies they were not truly necessary — so her life was full of things she didn&#39;t actually need.&quot;]}],[0,{&quot;number&quot;:[0,36],&quot;question&quot;:[0,&quot;In the final paragraph, the writer suggests that Elena&#39;s trip...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;Was a way for her to avoid her problems.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;Led her to a new and more fulfilling career path.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;Made it difficult for her to reconnect with her friends.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;Was the only reason she was able to lose weight.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;She set up a consultancy helping people transition to more meaningful careers. The text says she sees it as a \&quot;confrontation with herself\&quot;, not an escape (A is wrong).&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,6],&quot;type&quot;:[0,&quot;gapped-text&quot;],&quot;articleTitle&quot;:[0,&quot;From Vandalism to the Gallery&quot;],&quot;textParts&quot;:[1,[[0,&quot;Street art has undergone a remarkable transformation over the last few decades. What was once dismissed as simple vandalism, a nuisance to be scrubbed off walls as quickly as possible, is now celebrated as a legitimate and powerful form of artistic expression. Today, cities around the world use street art to revitalise neglected neighbourhoods and attract tourists. &quot;],[0,&quot; In the 1970s and 80s, the movement was primarily associated with the &#39;graffiti&#39; scene in New York City. Young artists would spray-paint their &#39;tags&#39; or names on subway cars and buildings, often at great personal risk. &quot;],[0,&quot; . They were not looking for fame in the traditional sense, but for recognition within their own community. To the authorities, however, this was a crime that contributed to the urban decay of the era. As the years went by, the style of the work began to evolve. Artists started moving beyond simple lettering to create complex murals that incorporated social and political messages. &quot;],[0,&quot; . One of the most famous figures in this transition is the British artist Banksy. His satirical and often dark-humoured stencils began appearing on walls in Bristol and London in the 1990s, capturing the public&#39;s imagination. The rise of the internet and social media played a crucial role in the global explosion of street art. &quot;],[0,&quot; . An artist could paint a wall in a remote alleyway in South America, and within hours, it would be seen by millions of people across the globe. This digital exposure turned local artists into international stars and led to street art festivals in cities from Stavanger to Melbourne. Consequently, the art world began to take notice. Art galleries and auction houses, which had previously ignored street art, started selling pieces for hundreds of thousands of pounds. &quot;],[0,&quot; . Some argue that by bringing street art indoors, it loses its rebellious spirit and its connection to the public space. They believe that the ephemeral nature of the work—the fact that it might be painted over tomorrow—is what gives it value. Despite these debates, street art continues to thrive and change our urban landscapes. &quot;],[0,&quot; . Whether it is a small sticker on a lamp post or a ten-storey mural, street art forces us to engage with our surroundings in a new way. It reminds us that the city belongs to the people who live in it, not just the people who build it.&quot;]]],&quot;sentences&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;This shift in perception has led to a heated debate among the artists themselves.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;Previously, a piece of art could only be appreciated by those who happened to walk past it.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;These early pioneers were often motivated by a desire to reclaim the urban environment.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;This development made it much harder for city councils to justify the cost of cleaning.&quot;]}],[0,{&quot;label&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;It has become a tool for social change, giving a voice to those who are often ignored.&quot;]}],[0,{&quot;label&quot;:[0,&quot;F&quot;],&quot;text&quot;:[0,&quot;However, the journey from the shadows to the spotlight has been a controversial one.&quot;]}],[0,{&quot;label&quot;:[0,&quot;G&quot;],&quot;text&quot;:[0,&quot;These works often required more planning and time, making the artists more vulnerable to being caught.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,37],&quot;answer&quot;:[0,&quot;F&quot;],&quot;explanation&quot;:[0,&quot;\&quot;However, the journey from the shadows to the spotlight has been a controversial one\&quot; introduces the contrast between the positive framing of the previous sentence and the difficult history that follows.&quot;]}],[0,{&quot;number&quot;:[0,38],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;\&quot;These early pioneers\&quot; refers back to the young artists of the 1970s/80s described in the previous sentence, and explains their motivation.&quot;]}],[0,{&quot;number&quot;:[0,39],&quot;answer&quot;:[0,&quot;G&quot;],&quot;explanation&quot;:[0,&quot;The sentence explains why creating complex murals (mentioned just before) made artists more vulnerable to being caught — requiring more time and planning.&quot;]}],[0,{&quot;number&quot;:[0,40],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Previously, a piece of art could only be appreciated by those who happened to walk past it\&quot; sets up the contrast with what the internet changed (now seen by millions).&quot;]}],[0,{&quot;number&quot;:[0,41],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;\&quot;This shift in perception\&quot; refers to the art world taking notice and selling street art in galleries — leading to the debate among artists themselves described next.&quot;]}],[0,{&quot;number&quot;:[0,42],&quot;answer&quot;:[0,&quot;E&quot;],&quot;explanation&quot;:[0,&quot;\&quot;It has become a tool for social change, giving a voice to those who are often ignored\&quot; summarises the current positive impact of street art, fitting the concluding tone.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,7],&quot;type&quot;:[0,&quot;multiple-matching&quot;],&quot;intro&quot;:[0,&quot;You are going to read an article about four people&#39;s views on the future of food.&quot;],&quot;texts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;name&quot;:[0,&quot;Mark – The Tech-Foodie&quot;],&quot;text&quot;:[0,&quot;I&#39;m a huge believer in lab-grown meat. Critics say it&#39;s &#39;unnatural&#39;, but think about the environmental footprint of traditional livestock—it&#39;s massive. Currently, the technology is still in its infancy and producing a single burger is incredibly expensive, but I&#39;m convinced the price will plummet as the process is scaled up. Imagine being able to eat a steak without a single cow being involved. It&#39;s cleaner, more ethical, and eventually, it&#39;ll be the only way to feed a growing global population. Some fear we&#39;ll lose the texture of real meat, but the science is catching up fast.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;name&quot;:[0,&quot;Sarah – The Insect Advocate&quot;],&quot;text&quot;:[0,&quot;I know, I know—the &#39;ick&#39; factor is real. Most people in the West find the idea of eating crickets or mealworms repulsive. But in many parts of the world, they&#39;re a delicacy. Insects are an incredible source of high-quality protein and minerals, and they require a fraction of the water and land that cattle do. I&#39;ve started using cricket flour in my baking, and honestly, you can&#39;t taste the difference. It&#39;s about shifting our cultural mindset. Once people realise it&#39;s a healthy, sustainable alternative to our current diet, it&#39;ll go mainstream.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;name&quot;:[0,&quot;David – The Vertical Farmer&quot;],&quot;text&quot;:[0,&quot;For me, the future isn&#39;t about what we eat, but where it grows. I&#39;m involved in a vertical farming project in London. We use abandoned underground tunnels to grow leafy greens using LED lights and hydroponics. There&#39;s something incredibly satisfying about knowing exactly where your food comes from. We don&#39;t need pesticides, and because we&#39;re in the heart of the city, there are zero &#39;food miles&#39;. I think we&#39;ll see more urban spaces—car parks, rooftops, basements—repurposed for food production. It&#39;s about making cities self-sufficient and resilient.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;name&quot;:[0,&quot;Elena – The Traditionalist&quot;],&quot;text&quot;:[0,&quot;I think we&#39;re overcomplicating things with all this tech. Our relationship with food has become too clinical. Tha
