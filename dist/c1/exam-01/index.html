se.&quot;],&quot;answer&quot;:[0,&quot;had not lent&quot;],&quot;explanation&quot;:[0,&quot;Conditional Type 3 (If + past perfect).&quot;]}],[0,{&quot;number&quot;:[0,26],&quot;sentence1&quot;:[0,&quot;It was a mistake for the company to ignore the customer&#39;s complaints.&quot;],&quot;keyword&quot;:[0,&quot;SHOULD&quot;],&quot;sentence2Begin&quot;:[0,&quot;The company&quot;],&quot;sentence2End&quot;:[0,&quot;the customer&#39;s complaints.&quot;],&quot;answer&quot;:[0,&quot;should not have ignored&quot;],&quot;explanation&quot;:[0,&quot;Modal of criticism for a past action.&quot;]}],[0,{&quot;number&quot;:[0,27],&quot;sentence1&quot;:[0,&quot;Experts believe that the landslides were caused by the recent heavy rains.&quot;],&quot;keyword&quot;:[0,&quot;RESULTED&quot;],&quot;sentence2Begin&quot;:[0,&quot;The landslides are&quot;],&quot;sentence2End&quot;:[0,&quot;the recent heavy rains.&quot;],&quot;answer&quot;:[0,&quot;thought to have resulted from&quot;],&quot;explanation&quot;:[0,&quot;Passive reporting structure (Subject + is thought + to have + past participle).&quot;]}],[0,{&quot;number&quot;:[0,28],&quot;sentence1&quot;:[0,&quot;\&quot;I&#39;m sorry I didn&#39;t tell you the truth earlier,\&quot; said Mark to his sister.&quot;],&quot;keyword&quot;:[0,&quot;APOLOGISED&quot;],&quot;sentence2Begin&quot;:[0,&quot;Mark&quot;],&quot;sentence2End&quot;:[0,&quot;her the truth earlier.&quot;],&quot;answer&quot;:[0,&quot;apologised for not telling&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Apologise for (not) doing something.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,29],&quot;sentence1&quot;:[0,&quot;You must not, under any circumstances, press this red button.&quot;],&quot;keyword&quot;:[0,&quot;ACCOUNT&quot;],&quot;sentence2Begin&quot;:[0,&quot;On&quot;],&quot;sentence2End&quot;:[0,&quot;you press this red button.&quot;],&quot;answer&quot;:[0,&quot;no account must / should&quot;],&quot;explanation&quot;:[0,&quot;Negative inversion: \&quot;On no account\&quot; + auxiliary + subject.&quot;]}],[0,{&quot;number&quot;:[0,30],&quot;sentence1&quot;:[0,&quot;It&#39;s very unlikely that the concert will be cancelled at such short notice.&quot;],&quot;keyword&quot;:[0,&quot;LITTLE&quot;],&quot;sentence2Begin&quot;:[0,&quot;There is&quot;],&quot;sentence2End&quot;:[0,&quot;the concert being cancelled at such short notice.&quot;],&quot;answer&quot;:[0,&quot;little / very little likelihood of&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Likelihood\&quot; + of + gerund.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,5],&quot;type&quot;:[0,&quot;reading-mcq&quot;],&quot;articleTitle&quot;:[0,&quot;The Architect of Concentration&quot;],&quot;text&quot;:[0,&quot;In the contemporary workplace, the ability to focus without distraction on a cognitively demanding task—a state computer scientist Cal Newport terms &#39;deep work&#39;—is becoming increasingly rare. At the same time, it is becoming arguably more valuable. We live in an era of &#39;shallow work&#39;, characterized by logistical-style tasks like answering emails, attending unnecessary meetings, and the constant, low-level hum of social media. While these activities provide a sense of busy-ness, they rarely create new value or are difficult to replicate. Deep work, by contrast, is the superpower of the 21st century.\n\nThe problem is that our brains are no longer wired for this kind of sustained effort. The constant pings of notifications have trained us to be &#39;cognitive switchers&#39;. Every time we glance at an incoming message, even if we don&#39;t fully engage with it, our attention remains partially fractured. This &#39;attention residue&#39; means that even when we return to our primary task, a part of our mind is still processing the interruption. Over time, this erodes our capacity for the high-level critical thinking required in fields as diverse as programming, law, and creative writing.\n\nMany corporations have unwittingly exacerbated this issue by designing offices that prioritize &#39;serendipitous collaboration&#39;. The open-plan office was supposed to be a hotbed of innovation, where ideas would collide in hallways and communal kitchens. In reality, it has become a source of perpetual interruption. For the knowledge worker, the trade-off is lopsided: the potential for a breakthrough conversation is far outweighed by the certain loss of three hours of deep concentration. It is a fundamental misunderstanding of how complex work is actually performed.\n\nFurthermore, there is a pervasive cultural myth that being &#39;always on&#39; is a badge of honour. We equate responsiveness with productivity. A worker who replies to an email within five minutes is seen as efficient, regardless of whether that interruption broke a flow state that could have produced something of genuine substance. This cult of connectivity creates a &#39;hollow&#39; productivity—a flurry of activity that leaves the individual exhausted but with little to show for their day other than a cleared inbox.\n\nTo master the art of deep work, one must treat focus like a muscle. It requires a radical restructuring of the workday. This might involve &#39;bimodality&#39;—dedicating specific days or weeks to intense focus while leaving the rest for shallow tasks—or &#39;rhythmic&#39; scheduling, where deep work happens in fixed blocks every morning before the digital world is allowed to intrude. It is not about working more hours; it is about the intensity of the hours worked. High-quality work produced is a function of time spent multiplied by the intensity of focus. If the intensity is zero, the output is zero, regardless of the time invested.\n\nUltimately, the shift toward deep work is not just a productivity hack; it is a quest for meaning. Shallow work is inherently unsatisfying. It is the deep, immersive struggle with a difficult problem that leads to the &#39;flow&#39; state—that magical zone where time disappears and we perform at our peak. In a world that is increasingly automated, the tasks that cannot be handled by an algorithm are precisely those that require deep work. To remain relevant, and to find fulfillment in our careers, we must learn to close the door, turn off the notifications, and rediscover the lost art of thinking.&quot;],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,31],&quot;question&quot;:[0,&quot;In the first paragraph, the writer suggests that &#39;shallow work&#39;...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;is a necessary foundation for achieving deep work.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;provides a deceptive impression of meaningful output.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;is more difficult to master than people generally assume.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;will eventually be replaced entirely by automated systems.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;The text says shallow work provides a \&quot;sense of busy-ness\&quot; but rarely creates value.&quot;]}],[0,{&quot;number&quot;:[0,32],&quot;question&quot;:[0,&quot;What does the writer mean by the term &#39;attention residue&#39;?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;The physical exhaustion caused by multitasking.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;The inability to remember information after an interruption.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;The lingering mental distraction that follows a change in task.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;The total loss of focus caused by loud office environments.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;It describes the part of the mind still \&quot;processing the interruption\&quot; after switching tasks.&quot;]}],[0,{&quot;number&quot;:[0,33],&quot;question&quot;:[0,&quot;The writer&#39;s attitude toward open-plan offices is that they...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;are highly effective for certain types of creative brainstorming.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;are based on a flawed premise regarding how innovation occurs.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;fail because workers are naturally reluctant to collaborate.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;could be improved if employees were given better headphones.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;The writer calls it a \&quot;fundamental misunderstanding\&quot; of how complex work is performed.&quot;]}],[0,{&quot;number&quot;:[0,34],&quot;question&quot;:[0,&quot;What point is made about responsiveness in the fourth paragraph?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;It is a vital skill for maintaining client relationships.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;It is often mistaken for genuine professional effectiveness.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;It is becoming easier to achieve thanks to new technologies.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;It helps to reduce the overall stress levels of a workforce.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;We \&quot;equate responsiveness with productivity,\&quot; which the author calls \&quot;hollow.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,35],&quot;question&quot;:[0,&quot;The formula mentioned in the fifth paragraph emphasizes that...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;the number of hours worked is the most important metric.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;focus is a fixed trait that cannot be improved.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;without total concentration, time spent working is wasted.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;deep work should only be attempted by highly skilled professionals.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;\&quot;If the intensity is zero, the output is zero,\&quot; regardless of the time invested.&quot;]}],[0,{&quot;number&quot;:[0,36],&quot;question&quot;:[0,&quot;In the final paragraph, the writer concludes that deep work is essential because...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;it is the only way to compete with artificial intelligence.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;it allows people to work shorter hours for the same pay.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;it is the primary source of professional and personal satisfaction.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;most people are naturally bored by shallow, logistical tasks.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;He calls it a \&quot;quest for meaning\&quot; and says it leads to the \&quot;flow state\&quot; which is satisfying.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,6],&quot;type&quot;:[0,&quot;cross-text&quot;],&quot;articleTitle&quot;:[0,&quot;The Digital Agora: Social Media and Democracy&quot;],&quot;intro&quot;:[0,&quot;You are going to read four extracts from articles in which experts discuss the impact of social media on political engagement. For questions 37 – 40, choose from the experts A – D. The experts may be chosen more than once.&quot;],&quot;texts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;name&quot;:[0,&quot;Dr. Aris Thorne&quot;],&quot;text&quot;:[0,&quot;Social media was once hailed as a revolutionary tool for democratization, a platform where the marginalized could find a voice. However, the reality has proven far more somber. The algorithms governing these platforms are designed to maximize engagement, which inevitably leads to the creation of &#39;echo chambers.&#39; Users are fed information that reinforces their existing biases, effectively insulating them from opposing viewpoints. This has not only stifled healthy debate but has also fueled a level of polarization that threatens the very fabric of democratic discourse. Rather than engaging in nuanced discussion, citizens are increasingly retreating into tribalism.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;name&quot;:[0,&quot;Prof. Elena Vargas&quot;],&quot;text&quot;:[0,&quot;It is easy to blame social media for the current state of political friction, but this overlooks the agency of the users themselves. While it is true that algorithms suggest content, individuals still have the capacity to seek out diverse perspectives. In fact, social media has mobilized younger generations in ways traditional media never could. We see grassroots movements gaining global traction overnight. The issue is not the technology itself, but a lack of digital literacy. If we educate citizens on how to navigate these platforms critically, the potential for social media to act as a force for positive political change remains immense.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;name&quot;:[0,&quot;Marcus Holloway&quot;],&quot;text&quot;:[0,&quot;The primary concern with digital political engagement is the illusion of participation, often referred to as &#39;slactivism.&#39; Clicking &#39;like&#39; or sharing a hashtag provides a sense of moral satisfaction without requiring any real-world effort or sacrifice. This dilutes the impact of traditional activism, such as protesting or voting. Furthermore, the speed at which information—and misinformation—spreads on these platforms makes it nearly impossible for the average user to discern truth from fabrication. The democratic process relies on a shared set of facts, and without that foundation, the digital agora becomes a breeding ground for manipulation.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;name&quot;:[0,&quot;Sarah Jenkins&quot;],&quot;text&quot;:[0,&quot;While I acknowledge the risks of polarization mentioned by others, I believe the benefits of social media for political transparency are often understated. These platforms have broken the monopoly that traditional media conglomerates once held over the news cycle. Politicians can now be held accountable in real-time by the public. Regarding the &#39;echo chamber&#39; effect, research suggests that users are actually exposed to a wider variety of views online than they are in their physical social circles. The conflict we see online is not necessarily a sign of a broken democracy, but rather the sound of voices that were previously silenced finally being heard.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,37],&quot;text&quot;:[0,&quot;shares Dr. Thorne&#39;s concern about the negative impact of algorithms on the quality of political debate?&quot;],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;Expert B agrees with Thorne (A) about the algorithms, stating \&quot;While it is true that algorithms suggest content...\&quot;&quot;]}],[0,{&quot;number&quot;:[0,38],&quot;text&quot;:[0,&quot;has a different opinion from the others regarding the extent to which social media exposes users to diverse viewpoints?&quot;],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;Expert D says research suggests users are exposed to a \&quot;wider variety of views online,\&quot; contradicting A, B, and C&#39;s focus on echo chambers/bias.&quot;]}],[0,{&quot;number&quot;:[0,39],&quot;text&quot;:[0,&quot;expresses a similar view to Holloway regarding the difficulty of verifying information online?&quot;],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;Expert A mentions citizens being \&quot;insulated from opposing viewpoints,\&quot; which relates to Holloway&#39;s (C) point about the difficulty of discerning truth from fabrication.&quot;]}],[0,{&quot;number&quot;:[0,40],&quot;text&quot;:[0,&quot;takes a more optimistic view than Dr. Thorne regarding the potential of social media to empower citizens?&quot;],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;Expert B sees \&quot;immense\&quot; potential for positive change, contrasting with Thorne&#39;s (A) \&quot;somber\&quot; reality.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,7],&quot;type&quot;:[0,&quot;gapped-text&quot;],&quot;articleTitle&quot;:[0,&quot;The City Beneath the Canopy&quot;],&quot;textParts&quot;:[1,[[0,&quot;Deep within the Honduran rainforest lies the Mosquitia region, a place so dense and inhospitable that for centuries it was known only through the whispers of local legends. Tales of a &#39;White City&#39; or the &#39;City of the Monkey God&#39; had circulated among explorers since the time of Hernán Cortés. However, the sheer impenetrable nature of the jungle meant that these stories remained firmly in the realm of folklore.&quot;],[0,&quot;This cutting-edge technology allowed researchers to &#39;see&#39; through the thick canopy by pulsing laser beams at the ground from an aircraft. The data revealed not just a few isolated buildings, but a vast, organized sprawling metropolis. It was clear that this was no mere myth; a sophisticated civilization had once thrived here, modifying the landscape on a massive scale.&quot;],[0,&quot;The team, led by archaeologist Chris Fisher, found itself in an environment where the wildlife had seemingly never encountered humans before. Monkeys peered down curiously from the trees, and a venomous snake even slithered through their camp at night. The sense of being the first outsiders to set foot in this sacred space in half a millennium was palpable.&quot;],[0,&quot;Among the most striking finds was a cache of stone sculptures at the base of a pyramid. These objects, left as an offering when the city was abandoned, remained exactly where they had been placed centuries ago. One particularly haunting piece depicted a &#39;were-jaguar&#39;, a shaman in a half-human, half-animal state.&quot;],[0,&quot;Evidence suggests that the city was abandoned in the early 16th century. Surprisingly, this was not due to warfare or environmental collapse, but likely because of the arrival of European diseases. Even though the Spanish never reached this far into the interior, the invisible killers—smallpox and measles—travelled along trade routes, devastating the population long before a single foreign soldier arrived.&quot;],[0,&quot;This raises difficult questions about how to protect such sites. Should they be excavated and turned into tourist destinations, or are they better left in the hands of the forest? The Honduran government has moved quickly to secure the area, but the threat from illegal logging and cattle ranching is ever-present.&quot;],[0,&quot;For now, the city remains a silent witness to a lost chapter of human history. The discovery reminds us that even in the age of satellites and global connectivity, the Earth still hides secrets that challenge our understanding of the past.&quot;]]],&quot;sentences&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;This preservation was largely due to the geographical isolation of the site. Unlike other Mayan cities that were looted over the centuries, the Mosquitia ruins remained shielded by the very environment that made them so difficult to find.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;Despite these successes, the expedition was not without its critics. Some local indigenous groups argued that the &#39;discovery&#39; was an insult to their heritage, as they had always known of the ruins&#39; existence through their oral traditions.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;To confirm these aerial findings, a ground expedition was launched in 2015. This was an undertaking of significant risk, involving former SAS soldiers to navigate the dangers of the terrain and scientists to document the archaeological wealth hidden beneath the vines.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;However, the transition from aerial mapping to physical exploration proved to be a logistical nightmare. The sheer density of the vegetation meant that the team could only move a few hundred yards a day, hacking through the brush with machetes.&quot;]}],[0,{&quot;label&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;That situation changed in 2012, when a team of scientists decided to bypass the traditional methods of trekking and instead employed LiDAR (Light Detection and Ranging).&quot;]}],[0,{&quot;label&quot;:[0,&quot;F&quot;],&quot;text&quot;:[0,&quot;Beyond the historical significance, the site is also a biological treasure. Many of the species found during the expedition are rare or were thought to be extinct, highlighting the need for a holistic approach to conservation that protects both the ruins and the surrounding ecosystem.&quot;]}],[0,{&quot;label&quot;:[0,&quot;G&quot;],&quot;text&quot;:[0,&quot;This tragic end is a recurring theme in the history of the Americas. The &#39;White City&#39; became a ghost town, its plazas and temples slowly reclaimed by the creeping roots and the humid breath of the jungle, until it disappeared from memory altogether.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,41],&quot;answer&quot;:[0,&quot;E&quot;],&quot;explanation&quot;:[0,&quot;\&quot;That situation changed...\&quot; connects the legend mention in the first paragraph to the LiDAR technology.&quot;]}],[0,{&quot;number&quot;:[0,42],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;\&quot;To confirm these aerial findings...\&quot; follows the mention of LiDAR data in the previous paragraph.&quot;]}],[0,{&quot;number&quot;:[0,43],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;\&quot;This preservation...\&quot; explains why the site mentioned in the ground expedition paragraph was so intact.&quot;]}],[0,{&quot;number&quot;:[0,44],&quot;answer&quot;:[0,&quot;G&quot;],&quot;explanation&quot;:[0,&quot;\&quot;This tragic end...\&quot; refers to the abandonment and were-jaguar cache mentioned in the previous paragraph.&quot;]}],[0,{&quot;number&quot;:[0,45],&quot;answer&quot;:[0,&quot;F&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Beyond the historical significance...\&quot; shifts the focus from history to the biological aspects of the site.&quot;]}],[0,{&quot;number&quot;:[0,46],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Despite these successes...\&quot; introduces the human/indigenous perspective as a contrast to the scientific protection.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,8],&quot;type&quot;:[0,&quot;multiple-matching&quot;],&quot;intro&quot;:[0,&quot;You are going to read an article in which four people discuss their experiences with &#39;Micro-adventures&#39; (short, local outdoor trips). For questions 47 – 56, choose from the people (A – D). The people may be chosen more than once.&quot;],&quot;texts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;name&quot;:[0,&quot;Clara&quot;],&quot;text&quot;:[0,&quot;I used to think that for an adventure to &#39;count&#39;, it had to involve a long-haul flight and a significant dent in my savings. That changed last summer when a friend suggested we take a train to a coastal town just two hours away and sleep on the beach. I was sceptical; I&#39;m a fan of my Egyptian cotton sheets. But there was something incredibly liberating about carrying everything I needed on my back. We watched the sunset, cooked over a small fire, and woke up with the tide. I returned to my office on Monday feeling more refreshed than I usually do after a two-week holiday in a luxury resort. It taught me that the psychological break from routine is more important than the distance travelled.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;name&quot;:[0,&quot;David&quot;],&quot;text&quot;:[0,&quot;As a father of three, the idea of a traditional expedition is a distant memory. However, I&#39;ve started &#39;wild swimming&#39; in a river near our house. We head out at 6:00 AM on Sundays. It&#39;s freezing, and my kids complain the whole way there, but once we&#39;re in the water, the sense of vitality is unmatched. It&#39;s about reclaiming the &#39;dead time&#39; in our week. People often complain they don&#39;t have time for nature, but we spend hours scrolling through our phones. A micro-adventure is a way to prove that you can find wonder in your own postcode. You just have to be willing to be a bit uncomfortable for a while.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;name&quot;:[0,&quot;Simon&quot;],&quot;text&quot;:[0,&quot;I&#39;m a bit of a gear-obsessive. I have the latest lightweight tents and high-tech stoves, but for years, they just sat in my garage. I was waiting for the &#39;perfect&#39; trip. Then I realized that if I waited for a month-long window in my schedule, I&#39;d be eighty before I used them. Now, I do &#39;S2S&#39; trips—Subway to Summit. I finish work on a Friday, take the tube to the edge of the city, and hike into the hills. I&#39;m back by Saturday night. The time constraint actually adds to the excitement. You don&#39;t have time to overthink it; you just go. It has transformed my relationship with the city; I no longer see it as a cage, but as a gateway.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;name&quot;:[0,&quot;Maya&quot;],&quot;text&quot;:[0,&quot;My micro-adventures are usually solo. There&#39;s a specific kind of confidence that comes from navigating a forest or setting up a tarp in the rain by yourself. I think we&#39;ve become too reliant on GPS and pre-packaged experiences. On my last trip, I got hopelessly lost in a local nature reserve. In the past, I would have panicked, but instead, I used it as an opportunity to actually look at the landscape rather than a screen. I eventually found my way back, but those hours of uncertainty were the most rewarding. It&#39;s not about the destination; it&#39;s about the shift in your own internal compass.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,47],&quot;text&quot;:[0,&quot;mentions a change in their perception of where they live?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Simon says it \&quot;transformed my relationship with the city... no longer a cage.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,48],&quot;text&quot;:[0,&quot;was initially doubtful about the appeal of a low-budget trip?&quot;],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;Clara says \&quot;I was sceptical\&quot; about the beach trip as she likes luxury sheets.&quot;]}],[0,{&quot;number&quot;:[0,49],&quot;text&quot;:[0,&quot;points out that modern habits are often used as an excuse for not being outdoors?&quot;],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;David mentions people spend \&quot;hours scrolling through our phones\&quot; instead of being in nature.&quot;]}],[0,{&quot;number&quot;:[0,50],&quot;text&quot;:[0,&quot;suggests that limited time can actually enhance the experience?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Simon says the \&quot;time constraint actually adds to the excitement.\&quot;&quot;]}],[0,{&quot;number&quot;
