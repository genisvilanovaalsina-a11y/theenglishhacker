st language or a highly complex cipher &quot;],[0,&quot; is simply beyond our current understanding. &quot;],[0,&quot; the case may be, the manuscript continues to exert a powerful fascination. It serves &quot;],[0,&quot; a reminder that despite our modern technology, there are still secrets from the past that we are unable &quot;],[0,&quot; uncover.&quot;]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,9],&quot;acceptedAnswers&quot;:[1,[[0,&quot;of&quot;]]],&quot;explanation&quot;:[0,&quot;\&quot;Consists of\&quot; is the fixed prepositional verb meaning to be made up of or composed of. No other preposition is grammatically possible here.&quot;]}],[0,{&quot;number&quot;:[0,10],&quot;acceptedAnswers&quot;:[1,[[0,&quot;yet&quot;]]],&quot;explanation&quot;:[0,&quot;\&quot;Has yet to be deciphered\&quot; is a formal structure meaning something has not happened so far. \&quot;Yet\&quot; in this position (between auxiliary and infinitive) expresses an unfulfilled expectation.&quot;]}],[0,{&quot;number&quot;:[0,11],&quot;acceptedAnswers&quot;:[1,[[0,&quot;alike&quot;]]],&quot;explanation&quot;:[0,&quot;\&quot;Cryptographers and linguists alike\&quot; uses \&quot;alike\&quot; as an adverb meaning \&quot;both\&quot; or \&quot;in the same way\&quot;. It emphasizes that multiple groups share the same characteristic.&quot;]}],[0,{&quot;number&quot;:[0,12],&quot;acceptedAnswers&quot;:[1,[[0,&quot;for&quot;]]],&quot;explanation&quot;:[0,&quot;\&quot;Created for the purpose of\&quot; — the preposition \&quot;for\&quot; follows \&quot;created\&quot; to introduce the purpose or intended goal.&quot;]}],[0,{&quot;number&quot;:[0,13],&quot;acceptedAnswers&quot;:[1,[[0,&quot;that&quot;],[0,&quot;which&quot;]]],&quot;explanation&quot;:[0,&quot;A relative pronoun is needed to introduce the relative clause defining the cipher. Both \&quot;that\&quot; and \&quot;which\&quot; are acceptable in this defining relative clause.&quot;]}],[0,{&quot;number&quot;:[0,14],&quot;acceptedAnswers rd&quot;:[0,&quot;INCREASE&quot;],&quot;answer&quot;:[0,&quot;increasing&quot;],&quot;explanation&quot;:[0,&quot;The adjective \&quot;increasing\&quot; (present participle as adjective) modifies \&quot;demand\&quot;, meaning a demand that is growing over time. \&quot;An increasing demand\&quot; = a demand that keeps growing.&quot;]}],[0,{&quot;number&quot;:[0,18],&quot;givenWord&quot;:[0,&quot;DEVELOP&quot;],&quot;answer&quot;:[0,&quot;development&quot;],&quot;explanation&quot;:[0,&quot;The noun \&quot;development\&quot; refers to a specific new advancement or solution. \&quot;One such development\&quot; = one such newly developed solution.&quot;]}],[0,{&quot;number&quot;:[0,19],&quot;givenWord&quot;:[0,&quot;STRIKE&quot;],&quot;answer&quot;:[0,&quot;striking&quot;],&quot;explanation&quot;:[0,&quot;The adjective \&quot;striking\&quot; means remarkable or notable. \&quot;Several striking advantages\&quot; = several advantages that are particularly impressive or obvious.&quot;]}],[0,{&quot;number&quot;:[0,20],&quot;givenWord&quot;:[0,&quot;REGARD&quot;],&quot;answer&quot;:[0,&quot;regardless&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Regardless of weather conditions\&quot; means without being affected by weather. \&quot;Regardless\&quot; is a fixed adverb used before \&quot;of\&quot; to introduce the irrelevant factor.&quot;]}],[0,{&quot;number&quot;:[0,21],&quot;givenWord&quot;:[0,&quot;ENVIRONMENT&quot;],&quot;answer&quot;:[0,&quot;environmentally&quot;],&quot;explanation&quot;:[0,&quot;The adverb \&quot;environmentally\&quot; modifies the compound adjective \&quot;-friendly\&quot;. \&quot;Environmentally friendly\&quot; is a fixed collocation meaning not harmful to the environment.&quot;]}],[0,{&quot;number&quot;:[0,22],&quot;givenWord&quot;:[0,&quot;VIABLE&quot;],&quot;answer&quot;:[0,&quot;viability&quot;],&quot;explanation&quot;:[0,&quot;The noun \&quot;viability\&quot; means the ability to work successfully or to be commercially sustainable. \&quot;The viability of these systems\&quot; = their ability to function successfully.&quot;]}],[0,{&quot;number&quot;:[0,23],&quot;givenWord&quot;:[0,&quot;SHORT&quot;],&quot;answer&quot;:[0,&quot;shortcomings&quot;],&quot;explanation&quot;:[0,&quot;The noun \&quot;shortcomings\&quot; (always plural in this usage) means faults or failures to reach a required standard. \&quot;Despite these shortcomings\&quot; introduces the counterargument.&quot;]}],[0,{&quot;number&quot;:[0,24],&quot;givenWord&quot;:[0,&quot;DECIDE&quot;],&quot;answer&quot;:[0,&quot;decisive&quot;],&quot;explanation&quot;:[0,&quot;The adjective \&quot;decisive\&quot; means settling an issue conclusively, or critically important. \&quot;Play a decisive role\&quot; means to have a crucial, determining influence.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,4],&quot;type&quot;:[0,&quot;key-word-transformation&quot;],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,25],&quot;sentence1&quot;:[0,&quot;I&#39;m sure it wasn&#39;t easy for her to admit she was wrong.&quot;],&quot;keyword&quot;:[0,&quot;CAN&#39;T&quot;],&quot;sentence2Begin&quot;:[0,&quot;It &quot;],&quot;sentence2End&quot;:[0,&quot; easy for her to admit she was wrong.&quot;],&quot;answer&quot;:[0,&quot;can&#39;t have been&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Can&#39;t have been\&quot; expresses a confident negative deduction about the past. \&quot;I&#39;m sure it wasn&#39;t\&quot; becomes \&quot;it can&#39;t have been\&quot; — the modal perfect structure for logical impossibility.&quot;]}],[0,{&quot;number&quot;:[0,26],&quot;sentence1&quot;:[0,&quot;We only realized the danger when the alarm went off.&quot;],&quot;keyword&quot;:[0,&quot;DID&quot;],&quot;sentence2Begin&quot;:[0,&quot;Not until the alarm went off &quot;],&quot;sentence2End&quot;:[0,&quot; the danger.&quot;],&quot;answer&quot;:[0,&quot;did we realize&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Not until... did + subject + verb\&quot; is a negative fronting inversion for emphasis. Moving \&quot;not until\&quot; to the front inverts the subject and auxiliary: \&quot;did we realize\&quot;.&quot;]}],[0,{&quot;number&quot;:[0,27],&quot;sentence1&quot;:[0,&quot;Experts believe that the painting is worth millions of dollars.&quot;],&quot;keyword&quot;:[0,&quot;ESTIMATED&quot;],&quot;sentence2Begin&quot;:[0,&quot;The painting &quot;],&quot;sentence2End&quot;:[0,&quot; worth millions of dollars.&quot;],&quot;answer&quot;:[0,&quot;is estimated to be&quot;],&quot;explanation&quot;:[0,&quot;Passive reporting with \&quot;estimate\&quot;: \&quot;Subject + is estimated + to be\&quot;. \&quot;Experts believe that X is worth Y\&quot; becomes \&quot;X is estimated to be worth Y\&quot;.&quot;]}],[0,{&quot;number&quot;:[0,28],&quot;sentence1&quot;:[0,&quot;\&quot;I really should have studied harder for the exam,\&quot; said Mark.&quot;],&quot;keyword&quot;:[0,&quot;REGRETTED&quot;],&quot;sentence2Begin&quot;:[0,&quot;Mark &quot;],&quot;sentence2End&quot;:[0,&quot; harder for the exam.&quot;],&quot;answer&quot;:[0,&quot;regretted not studying&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Regret + (not) + gerund\&quot; is the structure for expressing regret about a past action. \&quot;Should have studied harder\&quot; becomes \&quot;regretted not studying harder\&quot;. \&quot;Having studied\&quot; is also accepted.&quot;]}],[0,{&quot;number&quot;:[0,29],&quot;sentence1&quot;:[0,&quot;You won&#39;t be able to solve the puzzle if you don&#39;t look at it from a different angle.&quot;],&quot;keyword&quot;:[0,&quot;UNLESS&quot;],&quot;sentence2Begin&quot;:[0,&quot;You won&#39;t be able to solve the puzzle &quot;],&quot;sentence2End&quot;:[0,&quot; from a different angle.&quot;],&quot;answer&quot;:[0,&quot;unless you look at it&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Unless\&quot; replaces \&quot;if... not\&quot;. \&quot;If you don&#39;t look at it from a different angle\&quot; becomes \&quot;unless you look at it from a different angle\&quot;. Present simple after \&quot;unless\&quot;.&quot;]}],[0,{&quot;number&quot;:[0,30],&quot;sentence1&quot;:[0,&quot;The company&#39;s success is due to the hard work of its employees.&quot;],&quot;keyword&quot;:[0,&quot;PUT&quot;],&quot;sentence2Begin&quot;:[0,&quot;The company&#39;s success &quot;],&quot;sentence2End&quot;:[0,&quot; the hard work of its employees.&quot;],&quot;answer&quot;:[0,&quot;is put down to&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Put something down to something\&quot; is a phrasal verb meaning to attribute something to a cause. \&quot;Is due to\&quot; becomes \&quot;is put down to\&quot;. The passive \&quot;is put down to\&quot; is required.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,5],&quot;type&quot;:[0,&quot;reading-mcq&quot;],&quot;articleTitle&quot;:[0,&quot;The Vanishing Threshold of Silence&quot;],&quot;text&quot;:[0,&quot;In the 19th century, the philosopher Arthur Schopenhauer argued that the amount of noise a person can bear is in inverse proportion to their mental capacity. While this may be an elitist overstatement, it points to a profound shift in our relationship with the acoustic environment. In the pre-industrial era, silence was the default—a canvas upon which sounds were painted. Today, the situation has been entirely inverted; noise is the constant background, and silence is a rare, expensive commodity, often sought in sound-proofed pods or remote retreats. This transition has not only altered our urban landscapes but has fundamentally rewired our neurological responses to the world around us.\n\nThe problem is not merely the volume of noise, but its inescapable nature. We live in an era of &#39;ambient intrusion,&#39; where the hum of data centers, the whir of air conditioning, and the distant throb of traffic form a persistent wall of sound. Ecologists have noted that this has led to a &#39;narrowing of the acoustic horizon.&#39; In nature, an animal&#39;s survival depends on its ability to hear a snap of a twig at a distance. In the modern city, our acoustic horizon has shrunk to just a few metres. We are effectively living in a state of sensory claustrophobia, unaware of the rich tapestry of sound that our ancestors once took for granted.\n\nPsychologists have coined the term &#39;internal noise&#39; to describe the mental equivalent of this external cacophony. The constant stream of digital notifications and the expectation of instant connectivity mean that our brains are rarely in a state of repose. This lack of &#39;acoustic downtime&#39; prevents the brain from entering the Default Mode Network—the state associated with creativity, self-reflection, and the consolidation of memory. When we are denied silence, we are denied the opportunity to process our own lives. We become reactive rather than reflective, constantly ping-ponging between external stimuli without ever finding a steady internal centre.\n\nFurthermore, the commercialization of silence has created a new social divide. Silence is becoming a luxury good. High-end real estate is marketed not just on square footage or location, but on &#39;acoustic isolation.&#39; Meanwhile, those in lower-income brackets are disproportionately affected by noise pollution, living closer to airports, busy motorways, or industrial zones. This &#39;sonic inequality&#39; has real health consequences, with chronic noise exposure linked to increased rates of hypertension and cognitive impairment in children. It is a stark reminder that the quality of our environment is often a reflection of our economic status.\n\nHowever, there is a growing movement to reclaim silence as a human right. Some cities are experimenting with &#39;quiet zones&#39;—public parks or libraries where digital devices are banned and loud conversations are discouraged. Architects are also rethinking building design, moving away from the hard, reflective surfaces of minimalist glass and steel toward materials that absorb and diffuse sound. It is a recognition that a city is not just a place to work and consume, but a place to exist as a biological entity with specific sensory needs.\n\nUltimately, silence is not merely the absence of noise; it is a presence in its own right. It is the space in which thoughts can grow and empathy can flourish. In a world that is becoming increasingly loud, the ability to cultivate an internal silence is perhaps the most important survival skill of the 21st century. We must learn to defend our quiet spaces, both physical and mental, with the same vigour with which we defend our time and our privacy. For without silence, we lose the ability to hear not just the world, but ourselves.&quot;],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,31],&quot;question&quot;:[0,&quot;In the first paragraph, the writer mentions Schopenhauer to highlight...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;the intellectual superiority of people who prefer quiet environments.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;the historical change in how silence is perceived by society.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;the physical damage that noise can cause to the human brain.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;the necessity of silence for the development of scientific theories.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;Schopenhauer is used as a historical starting point to contrast how silence was once the default (pre-industrial) and is now a \&quot;rare, expensive commodity\&quot;. The reference establishes the historical shift. A misreads the writer&#39;s purpose — the writer calls the quote \&quot;elitist.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,32],&quot;question&quot;:[0,&quot;The term &#39;narrowing of the acoustic horizon&#39; refers to...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;the inability of modern people to focus on a single sound.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;the reduction in the distance over which we can perceive sounds.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;the physical shrinking of our ears due to lack of use.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;the loss of interest in listening to natural soundscapes.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;The text explains this metaphor directly: \&quot;our acoustic horizon has shrunk to just a few metres\&quot; — the distance over which we can hear has been reduced by urban noise. C is literally impossible, D is not mentioned.&quot;]}],[0,{&quot;number&quot;:[0,33],&quot;question&quot;:[0,&quot;What is the writer&#39;s concern regarding &#39;internal noise&#39; in the third paragraph?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;It makes people more likely to suffer from hearing loss later in life.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;It prevents the brain from performing vital cognitive and emotional tasks.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;It encourages people to spend too much money on digital devices.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;It leads to a breakdown in communication between different generations.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Internal noise\&quot; prevents the brain from \&quot;entering the Default Mode Network—the state associated with creativity, self-reflection, and the consolidation of memory.\&quot; These are vital cognitive and emotional tasks.&quot;]}],[0,{&quot;number&quot;:[0,34],&quot;question&quot;:[0,&quot;What point is made about &#39;sonic inequality&#39; in the fourth paragraph?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;Silence is becoming a resource that only the wealthy can easily access.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;Noise pollution is the primary cause of global economic instability.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;People in high-end real estate are often bored by the lack of noise.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;Children in noisy areas are more likely to become successful musicians.&quot;]}]]],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Acoustic isolation\&quot; is marketed as a luxury in high-end real estate, while lower-income residents live near airports and motorways — silence is a resource distributed by wealth.&quot;]}],[0,{&quot;number&quot;:[0,35],&quot;question&quot;:[0,&quot;The writer&#39;s attitude toward &#39;quiet zones&#39; in cities is that they...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;are a well-meaning but ultimately futile attempt to control noise.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;should be made mandatory in every residential neighbourhood.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;represent a necessary acknowledgement of our biological requirements.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;are too expensive for most city councils to implement effectively.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Quiet zones are described as \&quot;a recognition that a city... is a place to exist as a biological entity with specific sensory needs.\&quot; This is a positive, approving attitude. A is not supported; B is an overstatement.&quot;]}],[0,{&quot;number&quot;:[0,36],&quot;question&quot;:[0,&quot;In the final paragraph, the writer concludes that silence is...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;an empty space that needs to be filled with productive activity.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;a skill that can be taught in schools to improve academic results.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;a vital environment for personal growth and understanding.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;something that will eventually disappear entirely from the world.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Silence is \&quot;the space in which thoughts can grow and empathy can flourish\&quot; and \&quot;the most important survival skill of the 21st century.\&quot; A contradicts the writer&#39;s view that silence is NOT empty; D is too pessimistic.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,6],&quot;type&quot;:[0,&quot;cross-text&quot;],&quot;articleTitle&quot;:[0,&quot;The Universal Basic Income Debate&quot;],&quot;intro&quot;:[0,&quot;You are going to read four extracts from articles in which experts discuss the concept of Universal Basic Income (UBI). For questions 37 – 40, choose from the experts A – D. The experts may be chosen more than once.&quot;],&quot;texts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;name&quot;:[0,&quot;Dr. Julian Sterling&quot;],&quot;text&quot;:[0,&quot;The implementation of a Universal Basic Income (UBI) is often touted as the panacea for the looming crisis of automation. However, this perspective is dangerously simplistic. While a guaranteed income might provide a temporary safety net, it fails to address the psychological importance of work. Employment provides structure, social connection, and a sense of purpose that money alone cannot replace. Furthermore, the fiscal burden of such a scheme would be catastrophic, likely leading to the gutting of other essential public services like healthcare and education. We should be focusing on reskilling the workforce, not paying them to be idle.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;name&quot;:[0,&quot;Prof. Anita Desai&quot;],&quot;text&quot;:[0,&quot;Critics of UBI often rely on an outdated &#39;work ethic&#39; that equates human value with economic productivity. In an age where AI can outperform humans in many sectors, we must decouple survival from employment. UBI is not about encouraging idleness; it is about providing the security necessary for individuals to pursue creative, entrepreneurial, or caregiving roles that are currently undervalued by the market. Regarding the cost, many studies suggest that the administrative savings from replacing complex welfare systems, combined with a progressive tax on automation, would make UBI surprisingly sustainable.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;name&quot;:[0,&quot;Marcus Holloway&quot;],&quot;text&quot;:[0,&quot;The real strength of UBI lies in its potential to eliminate the &#39;poverty trap&#39; created by current means-tested benefits. At present, many individuals are discouraged from taking low-paid work because the loss of benefits makes them financially worse off. A flat, unconditional payment removes this disincentive. However, I share the concerns of those who fear that UBI could be used as a &#39;Trojan horse&#39; by governments looking to abdicate their responsibility for social housing and disability support. If UBI is used to replace the entire social safety net, the most vulnerable in society will undoubtedly suffer.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;name&quot;:[0,&quot;Sarah Jenkins&quot;],&quot;text&quot;:[0,&quot;While the economic arguments for UBI are compelling, we must consider the societal impact. There is significant evidence to suggest that a guaranteed income leads to improved health outcomes and higher levels of education, as people are no longer living in a state of constant financial anxiety. Unlike Dr. Sterling, I believe that the &#39;meaning&#39; people find in work is often a result of necessity rather than choice; given the freedom, most people would find far more meaningful ways to contribute to their communities. The challenge is ensuring that the payment is high enough to be transformative, but not so high that it triggers rampant inflation.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,37],&quot;text&quot;:[0,&quot;shares Dr. Sterling&#39;s view regarding the potential negative impact of UBI on public finances?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Holloway (C) shares Sterling&#39;s concern: he fears UBI could be used as a \&quot;Trojan horse\&quot; to make governments \&quot;abdicate their responsibility for social housing and disability support\&quot; — a parallel concern to Sterling&#39;s worry about \&quot;gutting essential public services\&quot;.&quot;]}],[0,{&quot;number&quot;:[0,38],&quot;text&quot;:[0,&quot;has a different opinion from Dr. Sterling about the source of meaning in people&#39;s lives?&quot;],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;Jenkins (D) explicitly disagrees with Dr. Sterling: \&quot;Unlike Dr. Sterling, I believe that the meaning people find in work is often a result of necessity rather than choice.\&quot; Sterling argues employment gives structure and purpose; Jenkins argues people would find better meaning if freed from necessity.&quot;]}],[0,{&quot;number&quot;:[0,39],&quot;text&quot;:[0,&quot;expresses a similar concern to Holloway about the possibility of UBI harming the most vulnerable if implemented incorrectly?&quot;],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;Sterling (A) shares Holloway&#39;s fear about harm to the vulnerable: Sterling warns UBI would lead to \&quot;gutting of essential public services like healthcare and education,\&quot; directly threatening the most vulnerable — the same concern as Holloway&#39;s \&quot;Trojan horse\&quot; for social housing and disability support.&quot;]}],[0,{&quot;number&quot;:[0,40],&quot;text&quot;:[0,&quot;shares Prof. Desai&#39;s belief that UBI could actually encourage more productive or creative activities?&quot;],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;Jenkins (D) shares Desai&#39;s optimism: \&quot;given the freedom, most people would find far more meaningful ways to contribute to their communities.\&quot; Desai similarly argues UBI enables \&quot;creative, entrepreneurial, or caregiving roles currently undervalued by the market\&quot;.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,7],&quot;type&quot;:[0,&quot;gapped-text&quot;],&quot;articleTitle&quot;:[0,&quot;The Cathedral of Books&quot;],&quot;textParts&quot;:[1,[[0,&quot;For over a century, the Central Reading Room had served as the quiet heart of the city&#39;s intellectual life. With its soaring vaulted ceilings and walls lined from floor to ceiling with leather-bound volumes, it was a space that commanded a hushed, reverent awe. However, decades of neglect and a leaking roof had taken their toll. By 2022, the plaster was crumbling, and the once-vibrant frescoes were obscured by a thick layer of grime.&quot;],[0,&quot;\n\nThe primary challenge was not just the structural repair, but the delicate task of conservation. The library&#39;s collection included manuscripts dating back to the 14th century, many of which were highly sensitive to changes in humidity and light. Any construction work had to be carried out with the precision of a surgical operation.&quot;],[0,&quot;\n\nThis involved the installation of a state-of-the-art climate control system, hidden discreetly behind the original oak panelling. It was a masterpiece of modern engineering, designed to maintain a constant temperature without the intrusive hum of traditional air conditioning. But as the workers peeled back the wood, they made an unexpected discovery.&quot;],[0,&quot;\n\nTucked behind a false wall was a series of hidden alcoves containing correspondence that had been lost for eighty years. These letters provided a fascinating glimpse into the lives of the librarians who had worked there during the war. It was a reminder that a library is not just a repository of books, but a witness to history.&quot;],[0,&quot;\n\nTo balance these historical finds with modern requirements, the architects had to be creative. The goal was to transform the library into a &#39;third space&#39;—somewhere that was neither home nor work, but a communal area for collaboration. This meant introducing high-speed digital infrastructure and flexible workspaces without compromising the room&#39;s hallowed atmosphere.&quot;],[0,&quot;\n\nThe response from the public has been overwhelmingly positive. On the day of the grand reopening, a queue stretched twice around the block. Students, researchers, and curious locals poured in, not just to consult the archives, but to sit in the presence of history. In a world that is increasingly digital and ephemeral, the library offers something tangible and enduring.&quot;],[0,&quot;\n\nThe success of the project has now become a blueprint for other heritage sites. It proves that with enough investment and vision, the past can be successfully integrated into the present. The Cathedral of Books is once again open, and its silence is no longer one of neglect, but of profound concentration.&quot;]]],&quot;sentences&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;This integration of the new and the old was achieved through the use of &#39;smart glass&#39; partitions. These allow for private study areas that remain visually connected to the main hall, maintaining the sense of scale that makes the room so special.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;However, some critics argued that the money spent on the restoration would have been better used on digital initiatives. They claimed that physical libraries are becoming obsolete in the age of the e-reader.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;It was this duality that defined the project from the start. Every decision, from the choice of lightbulbs to the type of floor wax, was debated by a committee of historians and technologists.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;Despite these fascinating diversions, the project had to stay on schedule. The roof was eventually replaced with slate tiles sourced from the original quarry, ensuring that the building&#39;s exterior remained identical to its 19th-century appearance.&quot;]}],[0,{&quot;label&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;This led to the launch of a multi-million-dollar restoration project. It was a massive undertaking that required the expertise of stonemasons, electricians, and art historians, all working in tandem to return the space to its former glory.&quot;]}],[0,{&quot;label&quot;:[0,&quot;F&quot;],&quot;text&quot;:[0,&quot;To prevent any damage, the most valuable items were temporarily moved to a secure, underground facility. This left the main hall eerily empty, allowing the restorers to see the true extent of the damage to the masonry.&quot;]}],[0,{&quot;label&quot;:[0,&quot;G&quot;],&quot;text&quot;:[0,&quot;This hidden cache caused a sensation in the local press. It delayed the restoration for months as archivists meticulously catalogued every scrap of paper, fearing that any careless movement might destroy the fragile ink.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,41],&quot;answer&quot;:[0,&quot;E&quot;],&quot;explanation&quot;:[0,&quot;\&quot;This led to the launch of a multi-million-dollar restoration project\&quot; directly follows the description of the library&#39;s crumbling state, explaining the consequence of the neglect and introducing the restoration effort.&quot;]}],[0,{&quot;number&quot;:[0,42],&quot;answer&quot;:[0,&quot;F&quot;],&quot;explanation&quot;:[0,&quot;\&quot;To prevent any damage, the most valuable items were temporarily moved to a secure, underground facility\&quot; explains the precautions needed before the construction work on the climate control system could begin.&quot;]}],[0,{&quot;number&quot;:[0,43],&quot;answer&quot;:[0,&quot;G&quot;],&quot;explanation&quot;:[0,&quot;\&quot;This hidden cache caused a sensation in the local press\&quot; — \&quot;this hidden cache\&quot; refers directly to the hidden alcoves and correspondence mentioned in the previous paragraph, and explains what happened next.&quot;]}],[0,{&quot;number&quot;:[0,44],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Despite these fascinating diversions, the project had to stay on schedule\&quot; — \&quot;these fascinating diversions\&quot; refers to the letters and archival discoveries, before the narrative returns to the practical restoration work.&quot;]}],[0,{&quot;number&quot;:[0,45],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;\&quot;This integration of the new and the old was achieved through smart glass partitions\&quot; explains how the architects balanced the need for modern digital workspaces (mentioned before) with the historic atmosphere of the room.&quot;]}],[0,{&quot;number&quot;:[0,46],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;\&quot;It was this duality that defined the project from the start\&quot; summarizes the overall balance between history and technology that has characterized the entire restoration — a fitting concluding observation before the final paragraph.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,8],&quot;type&quot;:[0,&quot;multiple-matching&quot;],&quot;intro&quot;:[0,&quot;You are going to read an article in which four architects discuss sustainable urban design. For questions 47 – 52, choose from the architects (A – D). The architects may be chosen more than once.&quot;],&quot;texts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;name&quot;:[0,&quot;Elena Rossi&quot;],&quot;text&quot;:[0,&quot;My focus is on &#39;upcycling&#39; the existing urban fabric. We spend too much time and energy tearing down old buildings and replacing them with &#39;green&#39; glass towers. The most sustainable building is the one that already exists. In my latest project, we converted a disused textile factory into a mixed-use residential block. By retaining the original brickwork and high ceilings, we saved thousands of tonnes of carbon that would have been released during demolition. The challenge is convincing developers that &#39;old&#39; doesn&#39;t mean &#39;inefficient&#39;. With the right insulation and smart windows, a 19th-century warehouse can be just as energy-efficient as a modern skyscraper.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;name&quot;:[0,&quot;Marcus Thorne&quot;],&quot;text&quot;:[0,&quot;I believe the future of sustainability lies in &#39;biophilic&#39; design—incorporating nature directly into the structure of our buildings. My firm designs &#39;vertical forests,&#39; where every balcony is a garden. This isn&#39;t just about aesthetics; the plants act as a natural filtration system for the city&#39;s air and help to regulate the building&#39;s temperature. It reduces the &#39;urban heat island&#39; effect significantly. However, it requires a complete rethink of how we manage water and structural weight. You can&#39;t just slap a few trees on a balcony; you have to design the entire building around the needs of the ecosystem it supports.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;name&quot;:[0,&quot;Sarah Jenkins&quot;],&quot;text&quot;:[0,&quot;For me, sustainability is less about the buildings themselves and more about the spaces between them. We need to design &#39;15-minute cities&#39; where everything a resident needs—work, school, healthcare, and groceries—is within a 15-minute walk or bike ride. This effectively eliminates the need for cars, which are the primary source of urban pollution. My work focuses on pedestrianizing entire districts and creating multi-functional public spaces. It&#39;s a social shift as much as an architectural one. If we make our cities more walkable, we don&#39;t just save the planet; we improve the physical and mental health of every citizen.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;name&quot;:[0,&quot;David Wu&quot;],&quot;text&quot;:[0,&quot;I&#39;m interested in the concept of &#39;responsive&#39; architecture. We use sensors and AI to allow buildings to adapt to their environment in real-time. For example, the windows of our latest office block adjust their tint based on the angle of the sun to minimize the need for air conditioning. We also use kinetic floors that harvest energy from the footsteps of people walking through the lobby. Some argue that this high-tech approach is too expensive, but the long-term energy savings are immense. We are moving toward a world where buildings are not static objects, but &#39;living&#39; entities that interact with their inhabitants.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,47],&quot;text&quot;:[0,&quot;argues that new construction is not always the best environmental choice?&quot;],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;Rossi says \&quot;The most sustainable building is the one that already exists\&quot; — explicitly arguing against demolition and new construction in favour of upcycling existing structures.&quot;]}],[0,{&quot;number&quot;:[0,48],&quot;text&quot;:[0,&quot;mentions a specific social benefit of their architectural philosophy?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Jenkins highlights specific social benefits: \&quot;we improve the physical and mental health of every citizen\&quot; and describes a \&quot;social shift\&quot; through walkable city design.&quot;]}],[0,{&quot;number&quot;:[0,49],&quot;text&quot;:[0,&quot;acknowledges that their approach requires a fundamental change in engineering logic?&quot;],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;Thorne says biophilic design \&quot;requires a complete rethink of how we manage water and structural weight\&quot; — a fundamental engineering change required to support living ecosystems on buildings.&quot;]}],[0,{&quot;number&quot;:[0,50],&quot;text&quot;:[0,&quot;highlights the importance of reducing the reliance on a specific type of transport?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Jenkins explicitly focuses on \&quot;eliminating the need for cars, which are the primary source of urban pollution\&quot; — identifying private cars as the specific transport to be reduced.&quot;]}],[0,{&quot;number&quot;:[0,51],&quot;text&quot;:[0,&quot;suggests that technology can make buildings behave like living organisms?&quot;],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;Wu says buildings are moving toward being \&quot;not static objects, but &#39;living&#39; entities that interact with their inhabitants\&quot; — directly describing technology-enabled buildings as living organisms.&quot;]}],[0,{&quot;number&quot;:[0,52],&quot;text&quot;:[0,&quot;mentions the financial arguments used to criticize their methods?&quot;],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;Wu acknowledges that \&quot;some argue that this high-tech approach is too expensive\&quot; — directly citing the financial criticism of his approach before countering it with long-term savings.&quot;]}]]]}]]]}],&quot;unlockUrl&quot;:[0,&quot;https://buy.stripe.com/8x2bJ1eELb6Tbqf3FTfMA01&quot;]}" ssr client="load" opts="{&quot;name&quot;:&quot;ExamPlayer&quot;,&quot;value&quot
