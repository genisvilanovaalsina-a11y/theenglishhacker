e2Begin&quot;:[0,&quot;The manager &quot;],&quot;sentence2End&quot;:[0,&quot; if the project fails.&quot;],&quot;answer&quot;:[0,&quot;is bound to resign&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Bound to\&quot; expresses strong certainty about a future event.&quot;]}],[0,{&quot;number&quot;:[0,26],&quot;sentence1&quot;:[0,&quot;It was only when I saw the photos that I realized how much the city had changed.&quot;],&quot;keyword&quot;:[0,&quot;DID&quot;],&quot;sentence2Begin&quot;:[0,&quot;Not until I saw the photos &quot;],&quot;sentence2End&quot;:[0,&quot; much the city had changed.&quot;],&quot;answer&quot;:[0,&quot;did I realize how&quot;],&quot;explanation&quot;:[0,&quot;Negative inversion (Not until... did + subject + verb).&quot;]}],[0,{&quot;number&quot;:[0,27],&quot;sentence1&quot;:[0,&quot;People say that the ancient ruins were built by a lost civilization.&quot;],&quot;keyword&quot;:[0,&quot;SAID&quot;],&quot;sentence2Begin&quot;:[0,&quot;The ancient ruins &quot;],&quot;sentence2End&quot;:[0,&quot; by a lost civilization.&quot;],&quot;answer&quot;:[0,&quot;are said to have been built&quot;],&quot;explanation&quot;:[0,&quot;Passive reporting structure (Subject + are said + to have been + past participle).&quot;]}],[0,{&quot;number&quot;:[0,28],&quot;sentence1&quot;:[0,&quot;\&quot;I&#39;m sorry I didn&#39;t help you with the decorations,\&quot; said Paul to his wife.&quot;],&quot;keyword&quot;:[0,&quot;APOLOGISED&quot;],&quot;sentence2Begin&quot;:[0,&quot;Paul &quot;],&quot;sentence2End&quot;:[0,&quot; her with the decorations.&quot;],&quot;answer&quot;:[0,&quot;apologised for not helping&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Apologise for [negative gerund].\&quot;&quot;]}],[0,{&quot;number&quot;:[0,29],&quot;sentence1&quot;:[0,&quot;If you hadn&#39;t intervened, the situation would have become much worse.&quot;],&quot;keyword&quot;:[0,&quot;BUT&quot;],&quot;sentence2Begin&quot;:[0,&quot;The situation would have become much worse &quot;],&quot;sentence2End&quot;:[0,&quot; intervention.&quot;],&quot;answer&quot;:[0,&quot;but for your&quot;],&quot;explanation&quot;:[0,&quot;\&quot;But for\&quot; is a formal conditional meaning \&quot;if it hadn&#39;t been for.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,30],&quot;sentence1&quot;:[0,&quot;It&#39;s very unlikely that the flight will be on time given the current weather.&quot;],&quot;keyword&quot;:[0,&quot;CHANCE&quot;],&quot;sentence2Begin&quot;:[0,&quot;There is &quot;],&quot;sentence2End&quot;:[0,&quot; the flight being on time given the current weather.&quot;],&quot;answer&quot;:[0,&quot;little/no chance of&quot;],&quot;explanation&quot;:[0,&quot;Expression used to indicate very low probability.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,5],&quot;type&quot;:[0,&quot;reading-mcq&quot;],&quot;articleTitle&quot;:[0,&quot;The Buildings That Shape Us&quot;],&quot;text&quot;:[0,&quot;We tend to think of architecture as a backdrop to our lives—something we pass through on our way to somewhere else. However, a growing body of research in the field of &#39;neuro-architecture&#39; suggests that the structures we inhabit do far more than just provide shelter. They actively sculpt our moods, our cognitive performance, and even our social interactions. For decades, urban planning was governed by a cold, functionalist logic that prioritized efficiency and cost-effectiveness. But as we move further into the 21st century, we are beginning to realize that the &#39;grey&#39; philosophy of the mid-20th century may have had a devastating impact on our collective mental wellbeing.\n\nThe problem often begins with the &#39;visual boredom&#39; of the modern city. Human beings are biologically wired to seek out complexity and patterns. In nature, we find fractal geometry—the repeating patterns found in trees, clouds, and coastlines. When we are exposed to these shapes, our brains enter a state of &#39;effortless attention,&#39; which reduces stress. By contrast, the flat, monochromatic glass and concrete surfaces that dominate many modern business districts provide no such relief. Studies using skin-conductance sensors have shown that people walking past dull, featureless buildings experience an increase in heart rate and cortisol levels. It is not just an aesthetic preference; it is a physiological stress response.\n\nFurthermore, the internal layout of buildings can fundamentally alter how we relate to one another. The infamous &#39;corridor-and-cubicle&#39; design of the late 20th-century office was intended to maximize focus and minimize distraction. In reality, it fostered a sense of isolation and hindered the spontaneous collaboration that is vital for innovation. Conversely, modern &#39;agora&#39; style offices, with wide-open communal spaces and clear lines of sight, are designed to trigger our ancestral preference for &#39;prospect and refuge&#39;—the ability to see a wide area while feeling protected from behind. However, even these can fail if the balance is wrong; an office that is too open can leave employees feeling constantly exposed, leading to &#39;social inhibition.&#39;\n\nThe impact of architecture is perhaps most visible in healthcare. For years, hospitals were designed to be sterile, windowless environments, largely for the convenience of medical staff and equipment maintenance. Yet, research has consistently shown that patients in rooms with views of nature recover significantly faster and require less pain medication than those staring at a brick wall. This phenomenon, known as &#39;biophilia,&#39; suggests that our connection to the natural world is not a luxury, but a biological necessity. Even a small change, such as the introduction of natural light or the use of organic materials like wood, can have a measurable impact on patient outcomes.\n\nCritics of neuro-architecture often argue that the data is too subjective and that &#39;good&#39; design is a matter of personal taste. They fear that a data-driven approach to architecture will lead to a new kind of sterile uniformity, where every building is designed by an algorithm to maximize happiness. However, proponents argue that we are not looking for a single &#39;perfect&#39; style, but rather a set of guiding principles that respect human biology. It is about moving away from the idea of a building as a &#39;machine for living&#39; and toward a more empathetic, human-centric approach.\n\nUltimately, we must recognize that we do not just live in cities; we are part of them. The environments we build today will determine the mental health of generations to come. If we continue to prioritize the bottom line over the human experience, we risk creating a world that is functionally perfect but emotionally uninhabitable. Architecture is not just about the strength of the steel or the quality of the glass; it is about the silent conversation between the walls and the people within them.&quot;],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,31],&quot;question&quot;:[0,&quot;In the first paragraph, the writer suggests that mid-20th century urban planning...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;was more effective at promoting social interaction than modern designs.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;failed to account for the psychological needs of city residents.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;was primarily focused on aesthetic beauty rather than functionality.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;is currently undergoing a revival among young architects.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;The text says the \&quot;cold, functionalist logic... may have had a devastating impact on our collective mental wellbeing.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,32],&quot;question&quot;:[0,&quot;What point is made about &#39;visual boredom&#39; in the second paragraph?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;It is a necessary trade-off for the convenience of city life.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;It can lead to measurable physical signs of stress in humans.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;It is caused by the over-complication of modern architectural patterns.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;It only affects people who have grown up in rural environments.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;It mentions studies showing people experience an increase in heart rate and cortisol (physical stress).&quot;]}],[0,{&quot;number&quot;:[0,33],&quot;question&quot;:[0,&quot;The writer uses the term &#39;social inhibition&#39; in the third paragraph to describe...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;the reluctance of employees to work in traditional cubicles.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;the tendency for people to become more productive when they are alone.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;the discomfort caused by a lack of privacy in open-plan offices.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;the way in which modern corridors discourage spontaneous meetings.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Refers to how too much openness leaves employees feeling \&quot;exposed,\&quot; inhibiting social interaction.&quot;]}],[0,{&quot;number&quot;:[0,34],&quot;question&quot;:[0,&quot;What is the writer&#39;s main point about healthcare design in the fourth paragraph?&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;Modern hospitals are too focused on the convenience of the medical staff.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;Sterile environments are essential for preventing the spread of disease.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;Physical surroundings can play a direct role in the healing process.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;Patients prefer high-tech equipment to natural views.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Discusses \&quot;biophilia\&quot; and how natural views have a \&quot;measurable impact on patient outcomes.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,35],&quot;question&quot;:[0,&quot;The writer&#39;s response to critics of neuro-architecture is that...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;their fears about algorithmic design are completely justified.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;subjective taste is the only thing that should matter in design.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;the goal is to create a set of human-centric guidelines, not a single style.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;data is more important than the artistic vision of the architect.&quot;]}]]],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;The author states proponents are not looking for a \&quot;single perfect style\&quot; but \&quot;guiding principles.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,36],&quot;question&quot;:[0,&quot;In the final paragraph, the writer concludes that architecture should...&quot;],&quot;options&quot;:[1,[[0,{&quot;value&quot;:[0,&quot;A&quot;],&quot;label&quot;:[0,&quot;focus more on the durability of building materials.&quot;]}],[0,{&quot;value&quot;:[0,&quot;B&quot;],&quot;label&quot;:[0,&quot;prioritize emotional inhabitability over financial profit.&quot;]}],[0,{&quot;value&quot;:[0,&quot;C&quot;],&quot;label&quot;:[0,&quot;be left entirely to the discretion of city councils.&quot;]}],[0,{&quot;value&quot;:[0,&quot;D&quot;],&quot;label&quot;:[0,&quot;aim to make every city in the world look the same.&quot;]}]]],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;Concludes we should stop prioritizing \&quot;the bottom line\&quot; (profit) over the \&quot;human experience.\&quot;&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,6],&quot;type&quot;:[0,&quot;cross-text&quot;],&quot;articleTitle&quot;:[0,&quot;Remote Work: The Productivity Debate&quot;],&quot;intro&quot;:[0,&quot;You are going to read four extracts from articles in which experts discuss the impact of remote work on professional productivity. For questions 37 – 40, choose from the experts A – D. The experts may be chosen more than once.&quot;],&quot;texts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;name&quot;:[0,&quot;Dr. Sarah Bennett&quot;],&quot;text&quot;:[0,&quot;The widespread shift to remote work has been a double-edged sword. While many employees report a better work-life balance, the long-term impact on &#39;deep&#39; productivity remains questionable. The lack of spontaneous, face-to-face interaction leads to a &#39;silo effect,&#39; where departments become increasingly disconnected. Innovation is rarely the result of a scheduled Zoom call; it happens in the &#39;in-between&#39; moments—the coffee machine chats and the quick desk-side questions. Without these, the intellectual capital of a company slowly erodes, replaced by a rigid, task-oriented output that lacks creative spark.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;name&quot;:[0,&quot;Marcus Vane&quot;],&quot;text&quot;:[0,&quot;Contrary to the fears of traditional managers, remote work has actually unlocked a new level of efficiency. By removing the daily commute and the constant interruptions of the open-plan office, workers are able to enter &#39;flow states&#39; more easily. Data from several Fortune 500 companies suggests that project completion times have decreased significantly since 2020. The key is autonomy; when you trust people to manage their own time, they generally work harder and more effectively. The &#39;in-person requirement&#39; is often less about productivity and more about a managerial desire for control.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;name&quot;:[0,&quot;Prof. Julian Hart&quot;],&quot;text&quot;:[0,&quot;We must distinguish between &#39;output&#39; and &#39;innovation.&#39; Remote work is excellent for the former; if you have a list of clear tasks, you will likely get them done faster at home. However, the latter relies on social friction. Research into organizational behavior suggests that complex problem-solving requires the non-verbal cues and high-bandwidth communication that only physical presence provides. Furthermore, the blurring of boundaries between home and office is leading to &#39;digital burnout,&#39; where workers feel they can never truly switch off. This long-term exhaustion will eventually cancel out any short-term gains in efficiency.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;name&quot;:[0,&quot;Elena Rodriguez&quot;],&quot;text&quot;:[0,&quot;The debate over remote work often misses the point about diversity and inclusion. For many workers, particularly those with caregiving responsibilities or disabilities, remote work is not a &#39;perk&#39; but a necessity for their professional participation. When these individuals are given the flexibility to work from home, their loyalty and productivity levels soar. While it is true that team cohesion requires effort, this can be achieved through intentional, high-quality in-person retreats rather than daily office attendance. The future of work is not &#39;all or nothing&#39;; it is a hybrid model that respects individual needs while maintaining strategic connection.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,37],&quot;text&quot;:[0,&quot;shares Bennett&#39;s view regarding the negative impact of remote work on creative innovation?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Both Bennett (A) and Hart (C) argue that remote work harms innovation/complex problem-solving.&quot;]}],[0,{&quot;number&quot;:[0,38],&quot;text&quot;:[0,&quot;has a different opinion from the others regarding the primary motivation behind requiring office attendance?&quot;],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;Vane (B) suggests the requirement to be in-person is about \&quot;managerial desire for control,\&quot; while others focus on innovation or team cohesion.&quot;]}],[0,{&quot;number&quot;:[0,39],&quot;text&quot;:[0,&quot;expresses a similar concern to Hart about the potential for remote work to cause long-term employee fatigue?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Hart (C) explicitly mentions \&quot;digital burnout,\&quot; which aligns with the \&quot;long-term exhaustion\&quot; mentioned by both.&quot;]}],[0,{&quot;number&quot;:[0,40],&quot;text&quot;:[0,&quot;takes a more positive view than Bennett on the possibility of maintaining team connection without daily office presence?&quot;],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;Rodriguez (D) argues cohesion can be maintained through \&quot;intentional retreats,\&quot; whereas Bennett (A) is more skeptical.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,7],&quot;type&quot;:[0,&quot;gapped-text&quot;],&quot;articleTitle&quot;:[0,&quot;The Last of the Clockmakers&quot;],&quot;textParts&quot;:[1,[[0,&quot;In a small workshop tucked away in the Jura Mountains of Switzerland, Jean-Pierre sits hunched over a workbench that has been in his family for three generations. The air is thick with the smell of machine oil and the rhythmic, polyphonic ticking of dozens of timepieces. Jean-Pierre is one of the few remaining practitioners of high-mechanical watchmaking, an art form that many predicted would be wiped out by the digital revolution.&quot;],[0,&quot;This resilience is not merely a matter of nostalgia. While a smartphone can tell the time with atomic precision, it lacks what Jean-Pierre calls the &#39;soul&#39; of a mechanical movement. A watch powered by a mainspring and regulated by a balance wheel is a living thing, a miniature universe of gears and levers that operates independently of any external power source.&quot;],[0,&quot;The process of creating a single bespoke watch can take over a year. It begins with the design of the movement, followed by the painstaking fabrication of hundreds of tiny components. Some of these parts are so small they can only be seen through a microscope, yet each must be polished to a mirror finish. This is not for aesthetic reasons alone; friction is the enemy of accuracy, and a perfectly smooth surface ensures the longevity of the mechanism.&quot;],[0,&quot;However, the industry faces a significant hurdle: the &#39;skills gap.&#39; For decades, young people were discouraged from entering the trades, steered instead toward careers in technology and finance. Consequently, the average age of a master watchmaker is now in the late fifties. If the knowledge of these veterans is not passed down soon, centuries of technical expertise could vanish.&quot;],[0,&quot;To address this, several high-end brands have established their own academies. These schools offer intensive four-year programmes where students learn everything from basic metallurgy to the complex mathematics of horology. The competition for a place is fierce, drawing applicants from across the globe who are eager to escape the ephemeral nature of the digital world.&quot;],[0,&quot;What these students find is a career that offers a rare form of psychological satisfaction. In an age of &#39;planned obsolescence,&#39; where most consumer goods are designed to be thrown away within a few years, a mechanical watch is built to last centuries. There is a profound sense of purpose in creating something that will be handed down as a family heirloom.&quot;],[0,&quot;As the sun sets over the mountains, Jean-Pierre carefully places a tiny screw into a gold plate. He knows that his work will likely still be ticking long after the latest smartphone has become a piece of e-waste. It is a quiet victory for the physical over the virtual, a reminder that some things are worth doing the slow way.&quot;]]],&quot;sentences&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;text&quot;:[0,&quot;This dedication to precision is what separates a mass-produced item from a masterpiece. It requires a level of patience and hand-eye coordination that can only be acquired through thousands of hours of practice.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;text&quot;:[0,&quot;The transition from apprentice to master is a long one, requiring not just technical ability but also a deep understanding of the history of the craft. It is a commitment that few are willing to make in our fast-paced society.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;text&quot;:[0,&quot;Despite this grim outlook, there has been a surprising surge of interest from the younger generation. There is a growing movement of &#39;new traditionalists&#39; who value the tactile and the permanent over the digital and the disposable.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;text&quot;:[0,&quot;In the 1970s, the arrival of cheap, battery-powered quartz watches led to the &#39;Quartz Crisis,&#39; which saw thousands of traditional watchmakers go out of business. It seemed that the mechanical watch was destined for the museum.&quot;]}],[0,{&quot;label&quot;:[0,&quot;E&quot;],&quot;text&quot;:[0,&quot;This newfound popularity has also been bolstered by a booming secondary market. Collectors are now willing to pay millions for rare, vintage mechanical pieces, viewing them as both art and a stable investment.&quot;]}],[0,{&quot;label&quot;:[0,&quot;F&quot;],&quot;text&quot;:[0,&quot;However, the revival of the industry was led by a handful of visionaries who realized that the more digital our lives became, the more we would crave the mechanical. They repositioned the mechanical watch not as a tool, but as a luxury status symbol.&quot;]}],[0,{&quot;label&quot;:[0,&quot;G&quot;],&quot;text&quot;:[0,&quot;It is this connection to the past and the future that provides the ultimate motivation. The watchmaker acts as a bridge between the artisan who lived three hundred years ago and the person who will wear the watch three hundred years from now.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,41],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Quartz Crisis\&quot; and the decline of the industry in the 70s follow the intro about predictions of the craft&#39;s death.&quot;]}],[0,{&quot;number&quot;:[0,42],&quot;answer&quot;:[0,&quot;F&quot;],&quot;explanation&quot;:[0,&quot;\&quot;However, the revival...\&quot; explains how the industry came back as a luxury status symbol.&quot;]}],[0,{&quot;number&quot;:[0,43],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;Explains that precision is what separates a masterpiece and follows the paragraph about microscope work.&quot;]}],[0,{&quot;number&quot;:[0,44],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;\&quot;Despite this grim outlook...\&quot; (regarding the skills gap) introduces the \&quot;new traditionalists.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,45],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;Connects the fierce competition for places in academies with the long commitment required.&quot;]}],[0,{&quot;number&quot;:[0,46],&quot;answer&quot;:[0,&quot;G&quot;],&quot;explanation&quot;:[0,&quot;Summarizes the \&quot;bridge between the past and future\&quot; before the concluding scene at sunset.&quot;]}]]]}],[0,{&quot;partNumber&quot;:[0,8],&quot;type&quot;:[0,&quot;multiple-matching&quot;],&quot;intro&quot;:[0,&quot;You are going to read an article in which four people discuss their experiences with Mentorship in their professional lives. For questions 43 – 52, choose from the people (A – D). The people may be chosen more than once.&quot;],&quot;texts&quot;:[1,[[0,{&quot;label&quot;:[0,&quot;A&quot;],&quot;name&quot;:[0,&quot;Sarah – The Corporate Executive&quot;],&quot;text&quot;:[0,&quot;When I started in the finance sector, it was a very male-dominated environment. I was lucky to find a mentor, Eleanor, who had navigated those waters decades before me. She didn&#39;t just give me career advice; she taught me the &#39;unwritten rules&#39; of the office—how to handle internal politics and when to speak up in meetings. I think many people make the mistake of looking for a mentor who is exactly like them. Eleanor and I were quite different in terms of personality, but her perspective was invaluable precisely because it challenged my own. She pushed me out of my comfort zone, forcing me to apply for roles I thought were beyond my reach. Without that push, I&#39;d likely still be in a mid-level management position.&quot;]}],[0,{&quot;label&quot;:[0,&quot;B&quot;],&quot;name&quot;:[0,&quot;David – The Tech Entrepreneur&quot;],&quot;text&quot;:[0,&quot;I&#39;ve had several mentors throughout my journey, and what I&#39;ve learned is that the relationship must be reciprocal. A lot of young founders think a mentor is a &#39;free consultant&#39; who will solve all their problems. In reality, a good mentor is there to ask the difficult questions that you&#39;re avoiding. My most impactful mentor was a retired CEO who was brutally honest with me about my leadership flaws. It was painful to hear at first, but it was exactly what I needed to grow. I also made sure to offer him something in return—I kept him updated on emerging tech trends that he was no longer exposed to. It became a genuine friendship rather than just a professional arrangement.&quot;]}],[0,{&quot;label&quot;:[0,&quot;C&quot;],&quot;name&quot;:[0,&quot;Chloe – The Freelance Designer&quot;],&quot;text&quot;:[0,&quot;As a freelancer, you don&#39;t have the natural structure of an office, so finding a mentor was a deliberate choice I made to avoid professional stagnation. I found my mentor through an online community. What I appreciated most was her focus on the &#39;business&#39; of design—how to price my work and negotiate with difficult clients. These are things they don&#39;t teach you in art school. She helped me realize that being a good artist isn&#39;t enough; you have to be a good businessperson too. The most important lesson I learned was to value my own time. Before the mentorship, I was constantly overworking for very little pay. She helped me break that cycle and build a sustainable career.&quot;]}],[0,{&quot;label&quot;:[0,&quot;D&quot;],&quot;name&quot;:[0,&quot;Marcus – The Researcher&quot;],&quot;text&quot;:[0,&quot;My mentorship experience was somewhat unconventional because it was a &#39;reverse mentorship.&#39; I was paired with a very senior academic who wanted to understand how social media was changing the landscape of scientific communication. Even though I was technically the one &#39;teaching&#39; him about digital tools, I learned an enormous amount about the rigour and ethics of research from our conversations. It broke down the traditional hierarchy that often exists in universities. It made me realize that mentorship isn&#39;t about age or status; it&#39;s about a shared curiosity and a willingness to learn from anyone, regardless of their position. It gave me the confidence to present my own ideas more boldly.&quot;]}]]],&quot;questions&quot;:[1,[[0,{&quot;number&quot;:[0,43],&quot;text&quot;:[0,&quot;mentions that the relationship provided benefits for both parties?&quot;],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;David mentions he kept his mentor updated on tech trends (reciprocal).&quot;]}],[0,{&quot;number&quot;:[0,44],&quot;text&quot;:[0,&quot;found that a mentor&#39;s differing personality was a positive factor?&quot;],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;Sarah says their \&quot;different personality... challenged my own.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,45],&quot;text&quot;:[0,&quot;was encouraged to pursue opportunities they initially felt unqualified for?&quot;],&quot;answer&quot;:[0,&quot;A&quot;],&quot;explanation&quot;:[0,&quot;Sarah was forced to \&quot;apply for roles I thought were beyond my reach.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,46],&quot;text&quot;:[0,&quot;mentions that their mentor helped them with practical skills not covered in their formal education?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;Chloe mentions learning to \&quot;price work and negotiate,\&quot; which \&quot;they don&#39;t teach you in art school.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,47],&quot;text&quot;:[0,&quot;participated in a mentorship where the traditional roles were somewhat flipped?&quot;],&quot;answer&quot;:[0,&quot;D&quot;],&quot;explanation&quot;:[0,&quot;Marcus mentions \&quot;reverse mentorship\&quot; where he taught the senior academic.&quot;]}],[0,{&quot;number&quot;:[0,48],&quot;text&quot;:[0,&quot;emphasizes that a mentor should not be expected to provide easy solutions?&quot;],&quot;answer&quot;:[0,&quot;B&quot;],&quot;explanation&quot;:[0,&quot;David says a mentor is not a \&quot;free consultant\&quot; to \&quot;solve all your problems.\&quot;&quot;]}],[0,{&quot;number&quot;:[0,49],&quot;text&quot;:[0,&quot;sought a mentor specifically to prevent their career from stalling?&quot;],&quot;answer&quot;:[0,&quot;C&quot;],&quot;explanation&quot;:[0,&quot;
